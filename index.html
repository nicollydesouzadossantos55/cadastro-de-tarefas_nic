<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhas tarefas</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <main class="cartao-aplicacao">
        <header class="cabecalho-aplicacao">

            <div class="titulo-aplicacao">
                <span class="detalhe-titulo">MEU PAINEL</span>

                <h1>Minhas tarefas🌸💗</h1>

                <p>Organize seu dia de um jeito simples.</p>
            </div>

            <button
                class="botao-icone"
                id="botao-alterar-tema"
                title="Alterar tema">

                <i class="fa-solid fa-moon"></i>

            </button>

        </header>


        <section class="caixa-entrada">

            <input
                type="text"
                name="campo-tarefas"
                id="campo-tarefas"
                placeholder="O que vamos fazer hoje?..."
                maxlength="40"
            >

            <button
                class="botao-principal"
                id="botao-adicionar">

                <i class="fa-solid fa-plus"></i>

                Adicionar

            </button>

        </section>


        <section class="area-tarefas">

            <div class="titulo-lista">
                <span>Suas tarefas</span>

                <i class="fa-regular fa-heart"></i>
            </div>


            <ul class="lista-tarefas" id="lista-tarefas">

                <!-- As tarefas serão inseridas dinamicamente via JavaScript -->

            </ul>

        </section>

    </div> <!-- fecha o cartao-aplicacao -->


  


    <script src="script.js"></script>


        <footer class="rodape-aplicacao">

            <span id="contador-tarefas">
                0 tarefas na lista
            </span>

            

        </footer>

    </main>


    <script src="script.js"></script>

    <section class="foto-final">
        <img src="image.png" alt="eu">
    </section>


</body>

</html>
